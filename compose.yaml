name: si-fleet-telemetry

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  app:
    build: .
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8081:8000"           # API (8080 is taken by the bridge's kafka-ui)
    env_file: .env
    volumes:
      - .:/var/www/html       # live code (vendor + ext baked in the image)
    networks: [default, shared]   # shared: scraped by the bridge's Prometheus
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  consumer:
    build: .
    command: ["php", "artisan", "kafka:consume-pings"]
    env_file: .env
    volumes:
      - .:/var/www/html
    networks: [default, shared]   # shared: reach kafka:9092
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

# Monitoring is the SHARED Prometheus + Grafana stack in si-fleet-mqtt-bridge
# (ports 9090 / 3000). It scrapes this app at app:8000/metrics over the shared
# docker network. Dashboard source: docker/grafana/dashboards/fleet-telemetry.json
# (deployed by copying it into the bridge's docker/grafana/dashboards/).

volumes:
  timescale-data:

networks:
  # Own network: timescaledb/redis/app/consumer always start, even with the
  # bridge down — so `make up` never aborts on a missing external network.
  default: {}
  # Cross-stack network shared with si-fleet-mqtt-bridge (kafka + Prometheus).
  # `make up` creates it idempotently; the bridge's kafka joins it as `kafka`.
  shared:
    name: fleet-shared
    external: true
