; Xdebug — trigger mode: only connects when XDEBUG_TRIGGER is present.
; No perf hit on normal requests when the IDE is not listening.
xdebug.mode=debug
xdebug.start_with_request=trigger
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.idekey=PHPSTORM
xdebug.discover_client_host=false
xdebug.log_level=0
